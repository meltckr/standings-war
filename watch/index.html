<style>
/* Standings War, the film on its own page. Tokens, fonts and the player's look follow ../css/styles.css (the War Room). */
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(../fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:800;font-display:swap;src:url(../fonts/barlow-condensed-800.woff2) format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:400 800;font-display:swap;src:url(../fonts/inter-var.woff2) format("woff2")}
/* --chrome is everything on the first screen that is not the film (header + speed row). The film takes the full width
   unless that would push the speed row off the screen; then it is as tall as fits, so the whole player stays in view. */
:root{--purple:#1D1160;--orange:#E56020;--gold:#F2B705;--night:#0E0835;--rule:rgba(255,255,255,.10);--rule-2:rgba(255,255,255,.18);--tx:#fff;--tx-2:rgba(255,255,255,.74);--tx-3:rgba(255,255,255,.52);
--cond:"Barlow Condensed",sans-serif;--font:Inter,sans-serif;--chrome:112px;--fit:calc((100vh - var(--chrome)) * 9 / 16)}
@supports (height:100dvh){:root{--fit:calc((100dvh - var(--chrome)) * 9 / 16)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--tx);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  background:radial-gradient(70% 60% at 85% 0%,rgba(229,96,32,.40) 0%,rgba(229,96,32,0) 60%),radial-gradient(50% 40% at 100% 0%,rgba(242,183,5,.18),rgba(242,183,5,0) 60%),linear-gradient(170deg,#2A1A7E 0%,#1D1160 45%,var(--night) 100%) var(--night)}
h1,p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px;padding:0 12px 0 14px;border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{position:relative;display:block;width:36px;height:30px;flex:none}
.mark::before{content:"";position:absolute;left:50%;top:-7px;width:28px;height:20px;margin-left:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(229,96,32,.42),rgba(242,183,5,.10) 60%,rgba(229,96,32,0));pointer-events:none}
.mark img{position:relative;display:block;width:36px;height:30px}
.wm{font:800 21px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.sub{margin-top:4px;font:600 11px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.sub span{color:var(--tx-3)}
.share{all:unset;box-sizing:border-box;flex:none;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;border-radius:99px;font:800 14px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(255,255,255,.08);border:1px solid var(--rule-2);cursor:pointer}
.share:hover{background:rgba(255,255,255,.16)}
.stage{display:flex;flex-direction:column;align-items:center}
.frame{position:relative;width:min(100%,480px,max(180px,var(--fit)));aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#08051F;box-shadow:0 0 0 1px var(--rule-2),0 24px 64px rgba(0,0,0,.45)}
.frame::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--purple),var(--orange) 50%,var(--gold));z-index:1;pointer-events:none}
.frame video{display:block;width:100%;height:100%;object-fit:contain;background:#08051F}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;width:100%;padding:8px 12px}
.speed{display:flex;align-items:center;gap:4px}
.rate{all:unset;box-sizing:border-box;min-width:44px;min-height:44px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;font:700 15px/1 var(--cond);letter-spacing:.06em;color:var(--tx-2);border:1px solid var(--rule-2);background:rgba(255,255,255,.04);cursor:pointer}
.rate:hover{border-color:rgba(242,183,5,.5);color:#fff}
.rate[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--night)}
.open{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-left:auto;font:600 14px/1 var(--font);color:var(--gold);text-decoration:none;white-space:nowrap}
.open:hover{color:#fff}
.rate:focus-visible,.share:focus-visible,.open:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.open:focus-visible{border-radius:6px}
.toast{position:fixed;left:50%;top:60px;z-index:5;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:10px 16px;border-radius:12px;background:#08051F;border:1px solid rgba(242,183,5,.45);font-size:13px;line-height:1.4;color:#fff;text-align:center;word-break:break-word}
.toast:empty{display:none}
html:not(.js) .needs-js{display:none}
@media (max-width:373px){:root{--chrome:160px}}   /* the speed row wraps to two lines */
@media (max-width:339px){.sub span{display:none}.share{padding:0 12px}}
@media (min-width:700px){
  :root{--chrome:168px}
  .top{height:72px;padding:0 max(24px,calc(50% - 600px))}.brand{gap:16px}
  .mark,.mark img{width:53px;height:44px}.mark::before{top:-10px;width:40px;height:30px;margin-left:-20px}
  .wm{font-size:28px}.sub{margin-top:5px;font-size:12px;letter-spacing:.14em}
  .share{padding:0 20px;font-size:15px}
  .stage{padding-top:20px}
  .frame{border-radius:14px}
  .bar{width:max(366px,min(480px,var(--fit)));padding:12px 0 20px}
  .speed{gap:8px}.rate{min-width:52px;padding:0 12px;font-size:16px}
  .toast{top:84px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="mark"><img src="../brand/summit-mark-88.png" srcset="../brand/summit-mark-88.png 2x, ../brand/summit-mark-176.png 4x" width="36" height="30" alt=""></span>
    <div>
      <p class="wm">Standings War</p>
      <h1 class="sub">How it works <span>&middot; 1:03</span></h1>
    </div>
  </div>
  <button type="button" class="share needs-js" id="share">Share</button>
</header>

<main class="stage">
  <div class="frame">
    <video id="film" controls playsinline preload="metadata" poster="../video/poster-v2-9x16.jpg" width="720" height="1280" aria-label="Standings War: how it works, 63 seconds, captions on the picture">
      <source src="../video/standings-war-how-it-works-v2-9x16.mp4" type="video/mp4">
      <a href="../video/standings-war-how-it-works-v2-9x16.mp4">Watch the film (MP4)</a>
    </video>
  </div>
  <div class="bar">
    <div class="speed needs-js" role="group" aria-label="Playback speed">
      <button type="button" class="rate" data-rate="1" aria-pressed="true">1x</button>
      <button type="button" class="rate" data-rate="1.25" aria-pressed="false">1.25x</button>
      <button type="button" class="rate" data-rate="1.5" aria-pressed="false">1.5x</button>
      <button type="button" class="rate" data-rate="2" aria-pressed="false">2x</button>
    </div>
    <a class="open" href="../">Open Standings War <span aria-hidden="true">&rarr;</span></a>
  </div>
  <p class="toast" id="status" role="status" aria-live="polite"></p>
</main>

<script>
(function () {
  document.documentElement.className = "js";
  var v = document.getElementById("film"), status = document.getElementById("status");
  var rates = Array.prototype.slice.call(document.querySelectorAll(".rate")), rate = 1, timer;
  function setRate(r) {
    rate = r;
    v.playbackRate = r; v.defaultPlaybackRate = r;
    rates.forEach(function (b) { b.setAttribute("aria-pressed", String(parseFloat(b.getAttribute("data-rate")) === r)); });
  }
  rates.forEach(function (b) { b.addEventListener("click", function () { setRate(parseFloat(b.getAttribute("data-rate"))); }); });
  // A speed picked before the film has loaded has to be put back once it does.
  v.addEventListener("loadedmetadata", function () { v.playbackRate = rate; });

  // Share this page's link: the phone's share sheet where there is one, otherwise copy it.
  function say(text, keep) {
    status.textContent = text;
    clearTimeout(timer);
    if (!keep) timer = setTimeout(function () { status.textContent = ""; }, 4000);
  }
  document.getElementById("share").addEventListener("click", function () {
    var url = location.href.split(/[?#]/)[0];
    if (navigator.share) {
      navigator.share({ title: "Standings War: how it works", url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { say("Link copied."); }, function () { say("Copy this link: " + url, true); });
    } else say("Copy this link: " + url, true);
  });
})();
</script>
